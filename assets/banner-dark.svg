<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t">
  <title id="t">Mohammad Dehghanpour, Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#30363d"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="110" fill="#8b949e" font-size="22">Hi, I'm</text>
    <text x="72" y="172" fill="#e6edf3" font-size="58" font-weight="700" letter-spacing="-1">Mohammad Dehghanpour</text>
    <text x="72" y="222" fill="url(#accent)" font-size="30" font-weight="600">Software Engineer</text>
  </g>
  <text x="72" y="266" fill="#8b949e" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Go · Python · TypeScript · AWS · Terraform</text>

  <!-- A small service graph -->
  <g transform="translate(850 60)">
    <g stroke="url(#edge)" stroke-width="2" stroke-opacity="0.55">
      <line x1="0" y1="100" x2="90" y2="40"/>
      <line x1="0" y1="100" x2="90" y2="160"/>
      <line x1="90" y1="40" x2="190" y2="100"/>
      <line x1="90" y1="160" x2="190" y2="100"/>
      <line x1="90" y1="160" x2="230" y2="190"/>
      <line x1="190" y1="100" x2="290" y2="30"/>
      <line x1="190" y1="100" x2="300" y2="125"/>
      <line x1="190" y1="100" x2="230" y2="190"/>
      <line x1="290" y1="30" x2="360" y2="80"/>
      <line x1="300" y1="125" x2="360" y2="80"/>
    </g>
    <g fill="#0d1117" stroke="url(#edge)" stroke-width="2.5">
      <circle cx="0" cy="100" r="10"/>
      <circle cx="90" cy="40" r="8"/>
      <circle cx="90" cy="160" r="9"/>
      <circle cx="290" cy="30" r="8"/>
      <circle cx="300" cy="125" r="10"/>
      <circle cx="230" cy="190" r="7"/>
      <circle cx="360" cy="80" r="7"/>
    </g>
    <circle cx="190" cy="100" r="22" fill="#6366f1" fill-opacity="0.18"/>
    <circle cx="190" cy="100" r="13" fill="url(#edge)"/>
  </g>
